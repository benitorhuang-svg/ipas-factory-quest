雙向閉迴路動態控制反饋</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default  " id="FQ_DIAGRAM_INSTANCE-18" data-look="neo" transform="translate(271, 99)"><rect class="basic label-container" style="" x="-156" y="-36" width="312" height="72"/><g class="label" style="" transform="translate(-140, -24)"><rect/><foreignObject width="280" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 280px; text-align: center; width: 280px;"><span class="nodeLabel "><p>1. Connection (智能連接層)隨插即用感測器、無縫數據採集、通訊協定轉換</p></span></div></foreignObject></g></g><g class="node default  " id="FQ_DIAGRAM_INSTANCE-19" data-look="neo" transform="translate(418, 231)"><rect class="basic label-container" style="" x="-156" y="-36" width="312" height="72"/><g class="label" style="" transform="translate(-140, -24)"><rect/><foreignObject width="280" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 280px; text-align: center; width: 280px;"><span class="nodeLabel "><p>2. Conversion (數據轉資訊層)信號過濾、特徵提取、設備健康度計算 (PHM)</p></span></div></foreignObject></g></g><g class="node default  " id="FQ_DIAGRAM_INSTANCE-20" data-look="neo" transform="translate(418, 327)"><rect class="basic label-container" style="" x="-156" y="-36" width="312" height="72"/><g class="label" style="" transform="translate(-140, -24)"><rect/><foreignObject width="280" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 280px; text-align: center; width: 280px;"><span class="nodeLabel "><p>3. Cyber (網路層)數位雙生 (Digital Twin) 鏡像映射、同儕設備大數據比對</p></span></div></foreignObject></g></g><g class="node default  " id="FQ_DIAGRAM_INSTANCE-21" data-look="neo" transform="translate(418, 435)"><rect class="basic label-container" style="" x="-156" y="-48" width="312" height="96"/><g class="label" style="" 