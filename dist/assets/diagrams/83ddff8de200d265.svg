 class="node default  " id="FQ_DIAGRAM_INSTANCE-20" data-look="neo" transform="translate(442, 442.3203125)"><rect class="basic label-container" style="" x="-156" y="-56.5859375" width="312" height="113.171875"/><g class="label" style="" transform="translate(-140, -44.5859375)"><rect/><foreignObject width="280" height="89.171875"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 280px; text-align: center; width: 280px;"><span class="nodeLabel "><p>3. Cyber (網路層)數位雙生 (Digital Twin) 鏡像映射、同儕設備大數據比對</p></span></div></foreignObject></g></g><g class="node default  " id="FQ_DIAGRAM_INSTANCE-21" data-look="neo" transform="translate(442, 579.4921875)"><rect class="basic label-container" style="" x="-156" y="-56.5859375" width="312" height="113.171875"/><g class="label" style="" transform="translate(-140, -44.5859375)"><rect/><foreignObject width="280" height="89.171875"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 280px; text-align: center; width: 280px;"><span class="nodeLabel "><p>4. Cognition (認知層)設備殘餘壽命 (RUL) 推估、專家決策支援、維修排程建議</p></span></div></foreignObject></g></g><g class="node default  " id="FQ_DIAGRAM_INSTANCE-22" data-look="neo" transform="translate(289, 752.6640625)"><rect class="basic label-container" style="" x="-156" y="-56.5859375" width="312" height="113.171875"/><g class="label" style="" transform="translate(-140, -44.5859375)"><rect/><foreignObject width="280" height="89.171875"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 280px; text-align: center; width: 280px;"><span class="nodeLabel "><p>5. Configuration (配置執行層)閉迴路自適應控制、參數動態補償、自律修復反饋</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="FQ_DIAGRAM_INSTANCE-23" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#00000