<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-labelledby="title desc">
  <title id="title">智慧生產工程師職能分解爆炸圖</title>
  <desc id="desc">依 iPAS 智慧生產工程師能力鑑定簡章之評鑑內容，呈現初級至中級的五層職能架構、資料迴路與能力主題。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.5" stop-color="#0b2840"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="41%" r="48%">
      <stop offset="0" stop-color="#1fd6e3" stop-opacity=".19"/>
      <stop offset=".58" stop-color="#176ca0" stop-opacity=".06"/>
      <stop offset="1" stop-color="#00101c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1ce3df"/><stop offset="1" stop-color="#1686dd"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4a9dff"/><stop offset="1" stop-color="#4c55db"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b7bff"/><stop offset="1" stop-color="#5749cb"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#80e8a9"/><stop offset="1" stop-color="#1fb886"/></linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#86a6c4"/><stop offset="1" stop-color="#466780"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#113b59" stop-opacity=".94"/><stop offset="1" stop-color="#0b263e" stop-opacity=".94"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8edff0" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#01070e" flood-opacity=".55"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#56e7e2"/></marker>
    <style>
      .tc { font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
      .micro { fill:#9ec0d6; font-size:20px; font-weight:600; letter-spacing:2px; }
      .label { fill:#eaf9ff; font-size:28px; font-weight:700; }
      .body { fill:#c9dfec; font-size:23px; font-weight:500; }
      .code { fill:#63f1e8; font-size:21px; font-weight:800; letter-spacing:1px; }
      .layer-title { fill:#fff; font-size:31px; font-weight:800; letter-spacing:1px; }
      .layer-sub { fill:#d5e8fa; font-size:21px; font-weight:600; }
    </style>
  </defs>

  <rect width="2560" height="1440" fill="url(#bg)"/>
  <rect width="2560" height="1440" fill="url(#grid)"/>
  <ellipse cx="1280" cy="650" rx="780" ry="630" fill="url(#halo)"/>
  <path d="M70 176H2490" stroke="#65eae6" stroke-opacity=".35"/>

  <g class="tc">
    <text x="74" y="83" class="micro">iPAS • 智慧生產工程師能力鑑定</text>
    <text x="74" y="142" fill="#f4fcff" font-size="54" font-weight="800">智慧生產工程師職能分解爆炸圖</text>
    <text x="74" y="211" fill="#99b9cc" font-size="25">從現場生產基礎，逐層整合設備、資料、製程與工廠管理能力</text>
    <g transform="translate(2130 75)">
      <rect width="355" height="88" rx="16" fill="#102e46" stroke="#3cd9dd" stroke-opacity=".6"/>
      <circle cx="39" cy="44" r="13" fill="#54e6df" filter="url(#glow)"/>
      <text x="72" y="39" class="micro" font-size="16">能力結構</text>
      <text x="72" y="65" fill="#ecfbff" font-size="21" font-weight="700">初級 L1  →  中級 L2</text>
    </g>
  </g>

  <!-- left knowledge callouts -->
  <g class="tc" filter="url(#shadow)">
    <rect x="70" y="300" width="650" height="230" rx="22" fill="url(#panel)" stroke="#5cbdcf" stroke-opacity=".48"/>
    <rect x="70" y="300" width="9" height="230" rx="4" fill="url(#slate)"/>
    <text x="106" y="344" class="code">L11 • 初級 / 生產與作業管理基礎</text>
    <text x="106" y="389" class="label">先建立「人、機、料、法」的營運底座</text>
    <text x="106" y="432" class="body">L111 計畫、組織、控制、統籌｜L112 途程、MBOM、標準作業程序</text>
    <text x="106" y="467" class="body">L113 MRP、WIP、現場倉｜L114 IE、標準工時、稼動/良率/效率</text>
    <text x="106" y="502" class="body">L115 管制圖設計、品質分析與管制、品質成本</text>

    <rect x="70" y="565" width="650" height="248" rx="22" fill="url(#panel)" stroke="#4ea4f5" stroke-opacity=".54"/>
    <rect x="70" y="565" width="9" height="248" rx="4" fill="url(#blue)"/>
    <text x="106" y="609" class="code" fill="#77b8ff">L12 • 初級 / 智慧製造產線管理基礎</text>
    <text x="106" y="654" class="label">把傳統產線接上即時資訊與智慧化能力</text>
    <text x="106" y="697" class="body">L121 ERP/MES、生產設備、保養、預測參數、設備介面</text>
    <text x="106" y="732" class="body">L122 物聯網（IoT）、人工智慧（AI）、網宇實體整合（CPS）</text>
    <text x="106" y="767" class="body">L123 設備操作與指標辨識：稼動率、良率、效率</text>

    <rect x="70" y="848" width="650" height="208" rx="22" fill="url(#panel)" stroke="#40d8bf" stroke-opacity=".56"/>
    <rect x="70" y="848" width="9" height="208" rx="4" fill="url(#lime)"/>
    <text x="106" y="892" class="code" fill="#82efb5">L13 • 初級 / 智慧生產與管理實務</text>
    <text x="106" y="937" class="label">將知識落地為可操作、可追溯的現場流程</text>
    <text x="106" y="980" class="body">L131 流程規劃、監控系統操作、在製品追蹤</text>
    <text x="106" y="1015" class="body">L132 排程調節、批次追溯、設備/模具、即時採集、資源配置</text>
  </g>

  <!-- right application callouts -->
  <g class="tc" filter="url(#shadow)">
    <rect x="1840" y="300" width="650" height="270" rx="22" fill="url(#panel)" stroke="#a888ff" stroke-opacity=".62"/>
    <rect x="2481" y="300" width="9" height="270" rx="4" fill="url(#violet)"/>
    <text x="1876" y="344" class="code" fill="#b9a6ff">L21 • 中級 / 生產與作業管理實務應用</text>
    <text x="1876" y="389" class="label">以工廠全局思考，讓資料轉成改善行動</text>
    <text x="1876" y="432" class="body">L211 生產實務、精實管理、智慧工廠、現場原理、MES 生產</text>
    <text x="1876" y="467" class="body">L212 MES 整合全廠資訊流/物流、設備整合與巨量資料應用</text>
    <text x="1876" y="502" class="body">排程優化、產線平衡、品質要因分析、即時生產資訊應用</text>

    <rect x="1840" y="605" width="650" height="270" rx="22" fill="url(#panel)" stroke="#28dfe1" stroke-opacity=".62"/>
    <rect x="2481" y="605" width="9" height="270" rx="4" fill="url(#cyan)"/>
    <text x="1876" y="649" class="code">L22 • 中級 / 設備與製程管理實務應用</text>
    <text x="1876" y="694" class="label">由單機操作，進階到跨設備管控與整合</text>
    <text x="1876" y="737" class="body">L221 IoT/CPS 原理、設備維護、設備與製程參數即時資料</text>
    <text x="1876" y="772" class="body">L222 感測器、機器視覺、機器人、通訊、智慧控制、管控介面</text>
    <text x="1876" y="807" class="body">L223 智慧設備操作、特性辨識與 KPI 應用</text>

    <rect x="1840" y="910" width="650" height="146" rx="22" fill="#103a4a" stroke="#57efe5" stroke-opacity=".68"/>
    <text x="1876" y="955" class="code">目標能力表現</text>
    <text x="1876" y="996" class="label" font-size="26">改善產線效率 • 維護智慧設備 • 落實精實管理</text>
    <text x="1876" y="1030" class="body" font-size="20">管理、分析、判斷、整合與實務應用</text>
  </g>

  <!-- connection rails -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M720 416H833L906 451" stroke="#7392a9" stroke-width="2" stroke-dasharray="7 9"/>
    <circle cx="906" cy="451" r="6" fill="#80a1b6"/>
    <path d="M720 689H820L902 718" stroke="#3b96ed" stroke-width="2" stroke-dasharray="7 9"/>
    <circle cx="902" cy="718" r="6" fill="#5aaaf4"/>
    <path d="M720 950H822L909 911" stroke="#3ee3bb" stroke-width="2" stroke-dasharray="7 9"/>
    <circle cx="909" cy="911" r="6" fill="#72f5bd"/>
    <path d="M1840 435H1733L1655 446" stroke="#9b84f7" stroke-width="2" stroke-dasharray="7 9"/>
    <circle cx="1655" cy="446" r="6" fill="#b19bff"/>
    <path d="M1840 741H1740L1658 648" stroke="#40dfe2" stroke-width="2" stroke-dasharray="7 9"/>
    <circle cx="1658" cy="648" r="6" fill="#59eeea"/>
  </g>

  <!-- exploded core -->
  <g class="tc" filter="url(#shadow)">
    <text x="1280" y="273" text-anchor="middle" class="micro" fill="#7bece4">由下而上疊合 · 由資料串連 · 向全廠最佳化</text>

    <!-- Layer 5 / top strategy -->
    <g>
      <polygon points="920,340 1465,270 1716,366 1171,436" fill="url(#violet)" opacity=".96"/>
      <polygon points="1171,436 1716,366 1716,467 1171,537" fill="#4635a9"/>
      <polygon points="920,340 1171,436 1171,537 920,441" fill="#6855d3"/>
      <path d="M920 340L1465 270L1716 366" fill="none" stroke="#d5caff" stroke-opacity=".8"/>
      <text x="1435" y="421" text-anchor="middle" class="layer-title">L21｜全廠管理・品質優化・精實改善</text>
      <text x="1435" y="456" text-anchor="middle" class="layer-sub">排程優化 × 產線平衡 × 品質要因 × 即時決策</text>
      <rect x="1022" y="373" width="119" height="38" rx="19" fill="#e5ddff" fill-opacity=".25"/>
      <text x="1082" y="399" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">中級 L2</text>
    </g>

    <!-- Layer 4 -->
    <g>
      <polygon points="870,543 1415,473 1666,569 1121,639" fill="url(#cyan)" opacity=".96"/>
      <polygon points="1121,639 1666,569 1666,670 1121,740" fill="#1476aa"/>
      <polygon points="870,543 1121,639 1121,740 870,644" fill="#1494b5"/>
      <path d="M870 543L1415 473L1666 569" fill="none" stroke="#c7ffff" stroke-opacity=".78"/>
      <text x="1385" y="624" text-anchor="middle" class="layer-title">L22｜設備・製程管理・管控介面</text>
      <text x="1385" y="659" text-anchor="middle" class="layer-sub">IoT / CPS × 感測器 × 視覺 × 機器人 × 智慧控制</text>
      <rect x="972" y="576" width="119" height="38" rx="19" fill="#d4ffff" fill-opacity=".25"/>
      <text x="1032" y="602" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">中級 L2</text>
    </g>

    <!-- Layer 3 -->
    <g>
      <polygon points="920,746 1465,676 1716,772 1171,842" fill="url(#blue)" opacity=".97"/>
      <polygon points="1171,842 1716,772 1716,873 1171,943" fill="#3b49bf"/>
      <polygon points="920,746 1171,842 1171,943 920,847" fill="#337bc9"/>
      <path d="M920 746L1465 676L1716 772" fill="none" stroke="#cfddff" stroke-opacity=".8"/>
      <text x="1435" y="827" text-anchor="middle" class="layer-title">MES / ERP × 生產資料中樞</text>
      <text x="1435" y="862" text-anchor="middle" class="layer-sub">資訊流與物流 × 設備整合 × 大數據收集、分析、管理</text>
      <rect x="1021" y="779" width="120" height="38" rx="19" fill="#dce4ff" fill-opacity=".25"/>
      <text x="1081" y="805" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">L12 + L21</text>
    </g>

    <!-- Layer 2 -->
    <g>
      <polygon points="870,949 1415,879 1666,975 1121,1045" fill="url(#lime)" opacity=".98"/>
      <polygon points="1121,1045 1666,975 1666,1076 1121,1146" fill="#168866"/>
      <polygon points="870,949 1121,1045 1121,1146 870,1050" fill="#1da87a"/>
      <path d="M870 949L1415 879L1666 975" fill="none" stroke="#daffe9" stroke-opacity=".86"/>
      <text x="1385" y="1030" text-anchor="middle" class="layer-title">現場執行・監控・追溯</text>
      <text x="1385" y="1065" text-anchor="middle" class="layer-sub">生產規劃 × WIP 追蹤 × 批次追溯 × 即時機台資訊 × 資源調度</text>
      <rect x="971" y="982" width="120" height="38" rx="19" fill="#e1fff0" fill-opacity=".28"/>
      <text x="1031" y="1008" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">初級 L13</text>
    </g>

    <!-- Layer 1 / base -->
    <g>
      <polygon points="920,1152 1465,1082 1716,1178 1171,1248" fill="url(#slate)" opacity=".99"/>
      <polygon points="1171,1248 1716,1178 1716,1279 1171,1349" fill="#385870"/>
      <polygon points="920,1152 1171,1248 1171,1349 920,1253" fill="#527a92"/>
      <path d="M920 1152L1465 1082L1716 1178" fill="none" stroke="#effaff" stroke-opacity=".8"/>
      <text x="1435" y="1233" text-anchor="middle" class="layer-title">生產與作業管理基礎</text>
      <text x="1435" y="1268" text-anchor="middle" class="layer-sub">計畫・組織・控制 × MBOM / MRP / SOP × IE × 品質管理</text>
      <rect x="1021" y="1185" width="120" height="38" rx="19" fill="#e9f5fb" fill-opacity=".28"/>
      <text x="1081" y="1211" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">初級 L11</text>
    </g>
  </g>

  <!-- vertical integration cue -->
  <g class="tc">
    <path d="M1790 1190V350" stroke="#56e7e2" stroke-width="3" stroke-opacity=".72" stroke-dasharray="8 11" marker-end="url(#arrow)"/>
    <text x="1824" y="797" fill="#71ede8" font-size="22" font-weight="800" transform="rotate(-90 1824 797)">整合、分析、改善能力持續上升</text>
    <g transform="translate(765 1200)">
      <rect width="109" height="114" rx="16" fill="#0b263b" stroke="#4cced4" stroke-opacity=".55"/>
      <path d="M30 34H78M30 56H78M30 78H59" stroke="#66eee8" stroke-width="5" stroke-linecap="round"/>
      <text x="54" y="103" text-anchor="middle" fill="#b9dbe8" font-size="16" font-weight="700">基礎</text>
    </g>
    <g transform="translate(1742 222)">
      <circle cx="49" cy="49" r="48" fill="#0b3041" stroke="#61efe8" stroke-opacity=".8"/>
      <path d="M49 19V80M22 51L49 19L76 51M29 76H70" stroke="#72f6ec" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="49" y="112" text-anchor="middle" fill="#a2d1e3" font-size="16" font-weight="700">進階整合</text>
    </g>
  </g>

  <g class="tc">
    <path d="M70 1370H2490" stroke="#65eae6" stroke-opacity=".35"/>
    <text x="74" y="1411" fill="#9ab8ca" font-size="19">資料依據：〈智慧生產工程師能力鑑定簡章〉第 2.5 節「評鑑主題與評鑑內容」，L1 初級、L2 中級。</text>
    <text x="2488" y="1411" text-anchor="end" fill="#75ddd8" font-size="19" font-weight="700">職能地圖｜2026</text>
  </g>
</svg>
